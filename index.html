    <link rel="apple-touch-startup-image" href="./splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="./splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

  </head>
  <body>
    <div id="root"></div>
    <script>
      // Si el WebView del teléfono es demasiado viejo, la app no arrancaría y se
      // vería una pantalla negra. Mejor decirlo, y decir cómo arreglarlo.
      (function () {
        var falta = []
        if (!window.indexedDB) falta.push('almacenamiento de datos')
        // createImageBitmap ya no se exige: la galería sabe apañarse con <img>.
        if (!Object.fromEntries) falta.push('JavaScript moderno')
        if (!window.CSS || !CSS.supports('aspect-ratio', '1')) falta.push('CSS moderno')
        if (!falta.length) return
        // Marcar para que main.tsx no monte encima de este mensaje.
        window.__navegadorIncompatible = true
        document.getElementById('root').innerHTML =
          '<div style="padding:32px 24px;font-family:Georgia,serif;color:#E9E2D4;line-height:1.6">' +
          '<h1 style="font-size:1.4rem;margin:0 0 14px;color:#C9A46A">El navegador de este teléfono es muy antiguo</h1>' +
          '<p style="margin:0 0 12px">La app necesita ' + falta.join(', ') + ', y aquí no está disponible.</p>' +
          '<p style="margin:0 0 12px">Abre la Play Store y actualiza <b>Android System WebView</b> y <b>Chrome</b>. ' +
          'Suele bastar con eso: no hace falta cambiar de teléfono.</p>' +
          '<p style="margin:0;color:#8C8377;font-size:.9rem">Tus datos no se han tocado.</p></div>'
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
