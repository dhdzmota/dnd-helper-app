escudo como acción adicional. Sumas el bonificador del escudo a salvaciones de Destreza contra efectos que solo te apunten a ti, y puedes anular por completo el daño de esas salvaciones superadas."},{id:"tough",name:"Duro",en:"Tough",text:"Tu máximo de puntos de golpe aumenta en 2 por cada nivel que tengas, y en 2 más cada vez que subas de nivel."},{id:"lucky",name:"Afortunado",en:"Lucky",text:"Tienes 3 puntos de suerte por descanso largo. Puedes gastar uno para tirar un d20 adicional en una tirada de ataque, prueba o salvación, o para forzar la retirada de un ataque contra ti."},{id:"heavy-armor-master",name:"Maestro de Armadura Pesada",en:"Heavy Armor Master",prereq:"Competencia con armadura pesada",text:"Sube tu Fuerza en 1, hasta 20. Mientras lleves armadura pesada, el daño contundente, perforante y cortante no mágico que recibas se reduce en 3."},{id:"inspiring-leader",name:"Líder Inspirador",en:"Inspiring Leader",prereq:"Carisma 13 o más",text:"Tras 10 minutos de arenga, hasta seis criaturas que puedan verte y oírte ganan puntos de golpe temporales iguales a tu nivel + tu modificador de Carisma."},{id:"mobile",name:"Móvil",en:"Mobile",text:"Tu velocidad aumenta en 10 pies. Al Correr, el terreno difícil no te cuesta movimiento extra ese turno. Si atacas cuerpo a cuerpo a una criatura, no provocas su ataque de oportunidad ese turno."},{id:"alert",name:"Alerta",en:"Alert",text:"Ganas +5 a la iniciativa, no puedes ser sorprendido mientras estés consciente, y las criaturas ocultas no ganan ventaja en sus ataques contra ti."},{id:"magic-initiate",name:"Iniciado en la Magia",en:"Magic Initiate",cantrips:2,text:"Elige una clase: bardo, clérigo, druida, brujo, mago o hechicero. Aprendes dos trucos de su lista y un conjuro de nivel 1, que puedes lanzar una vez por descanso largo sin gastar espacio. Usas la característica de lanzamiento de esa clase."},{id:"fey-touched",name:"Tocado por lo Feérico",en:"Fey Touched",source:"TCE",text:"Sube en 1 tu Inteligencia, Sabiduría o Carisma, hasta 20. Aprendes Paso Brumoso y un conjuro de nivel 1 de adivinación o encantamiento. Puedes lanzar cada uno una vez por descanso largo sin gastar espacio, o gastando espacios normalmente."},{id:"savage-attacker",name:"Atacante Salvaje",en:"Savage Attacker",text:"Una vez por turno, cuando tiras el daño de un ataque cuerpo a cuerpo con arma, puedes volver a tirar los dados y usar cualquiera de los dos resultados."},{id:"defensive-duelist",name:"Duelista Defensivo",en:"Defensive Duelist",prereq:"Destreza 13 o más",text:"Cuando empuñas un arma de finura con la que eres competente y otra criatura te acierta cuerpo a cuerpo, puedes usar tu reacción para sumar tu bonificador de competencia a la CA contra ese ataque, posiblemente fallándolo."},{id:"elemental-adept",name:"Adepto Elemental",en:"Elemental Adept",prereq:"Capacidad de lanzar al menos un conjuro",text:"Elige ácido, frío, fuego, relámpago o trueno. Tus conjuros ignoran la resistencia a ese tipo de daño, y cada 1 que saques en los dados de daño de ese tipo cuenta como 2."},{id:"shadow-touched",name:"Tocado por la Sombra",en:"Shadow Touched",source:"TCE",text:"Sube en 1 tu Inteligencia, Sabiduría o Carisma, hasta 20. Aprendes Invisibilidad y un conjuro de nivel 1 de ilusión o nigromancia. Puedes lanzar cada uno una vez por descanso largo sin gastar espacio, o gastando espacios normalmente."},{id:"skill-expert",name:"Experto en Habilidades",en:"Skill Expert",source:"TCE",text:"Sube en 1 una característica, hasta 20. Ganas competencia en una habilidad a tu elección, y eliges una habilidad en la que ya seas competente para ganar pericia: tu bonificador de competencia se dobla en ella."},{id:"metamagic-adept",name:"Adepto de la Metamagia",en:"Metamagic Adept",source:"TCE",prereq:"Capacidad de lanzar al menos un conjuro",text:"Aprendes dos opciones de metamagia de la lista de hechicero. Ganas 2 puntos de hechicería, que se reponen en cada descanso largo y solo sirven para la metamagia."},{id:"fighting-initiate",name:"Iniciado en el Combate",en:"Fighting Initiate",source:"TCE",prereq:"Competencia con un estilo de combate marcial",text:"Aprendes un estilo de combate a tu elección. Cada vez que ganes una mejora de característica puedes cambiarlo por otro."},{id:"telekinetic",name:"Telequinético",en:"Telekinetic",source:"TCE",text:"Sube en 1 tu Inteligencia, Sabiduría o Carisma, hasta 20. Aprendes Mano de Mago y puedes lanzarlo sin componentes ni mano visible. Como acción adicional, empujas o atraes 5 pies a una criatura a 30 pies que falle una salvación de Fuerza."},{id:"telepathic",name:"Telepático",en:"Telepathic",source:"TCE",text:"Sube en 1 tu Inteligencia, Sabiduría o Carisma, hasta 20. Puedes hablar telepáticamente con cualquier criatura a 60 pies que entienda un idioma. Además lanzas Detectar Pensamientos una vez por descanso largo sin gastar espacio."},{id:"crusher",name:"Aplastador",en:"Crusher",source:"TCE",text:"Sube en 1 tu Fuerza o Constitución, hasta 20. Una vez por turno, al infligir daño contundente, mueves al objetivo 5 pies. Cuando le sacas un crítico, los ataques contra él tienen ventaja hasta el inicio de tu siguiente turno."},{id:"piercer",name:"Perforador",en:"Piercer",source:"TCE",text:"Sube en 1 tu Fuerza o Destreza, hasta 20. Una vez por turno, al infligir daño perforante, vuelves a tirar un dado de daño y usas el nuevo resultado. Con un crítico, tiras un dado de daño más."},{id:"slasher",name:"Tajador",en:"Slasher",source:"TCE",text:"Sube en 1 tu Fuerza o Destreza, hasta 20. Una vez por turno, al infligir daño cortante, reduces la velocidad del objetivo en 10 pies. Con un crítico, queda con desventaja en sus ataques hasta el inicio de tu siguiente turno."},{id:"chef",name:"Cocinero",en:"Chef",source:"TCE",text:"Sube en 1 tu Constitución o Sabiduría, hasta 20. Ganas competencia con utensilios de cocina. En un descanso corto puedes cocinar para 4 + tu bonificador de competencia: cada uno recupera 1d8 extra al gastar dados de golpe. En una hora haces dulces que dan 1 punto temporal."},{id:"poisoner",name:"Envenenador",en:"Poisoner",source:"TCE",text:"Ganas competencia con el kit de envenenador y ignoras la resistencia al daño de veneno. Como acción adicional untas un arma: quien la reciba hace una salvación de Constitución CD 14 o recibe 2d8 de veneno y queda envenenado 1 minuto."}],bs=Object.fromEntries(yd.map(e=>[e.id,e])),uh=[["burning-hands","Manos Ardientes","Burning Hands",1,"Evocación","1 acción","Personal (cono de 15 pies)","V, S","Instantáneo","Un fino manto de llamas sale de tus dedos. Cada criatura del cono hace una salvación de Destreza: 3d6 de daño de fuego si falla, mitad si la supera. A niveles superiores: +1d6 por cada nivel por encima del 1."],["charm-person","Encantar Persona","Charm Person",1,"Encantamiento","1 acción","30 pies","V, S","1 hora","Un humanoide hace una salvación de Sabiduría con ventaja si tú o tus aliados estáis peleando con él. Si falla, queda encantado y te considera un conocido amistoso. Al terminar sabe que lo encantaste."],["chromatic-orb","Orbe Cromático","Chromatic Orb",1,"Evocación","1 acción","90 pies","V, S, M","Instantáneo","Lanzas una esfera de 4 pulgadas y eliges su tipo de daño: ácido, frío, fuego, relámpago, veneno o trueno. Ataque de conjuro a distancia: 3d8 de ese daño. A niveles superiores: +1d8 por nivel."],["color-spray","Rociada de Color","Color Spray",1,"Ilusión","1 acción","Personal (cono de 15 pies)","V, S, M","1 asalto","Tiras 6d10: es el total de puntos de golpe de criaturas que puedes cegar. Empezando por la de menos puntos actuales, cada criatura del cono queda cegada hasta el final de tu siguiente turno. A niveles superiores: +2d10 por nivel."],["comprehend-languages","Comprender Idiomas","Comprehend Languages",1,"Adivinación","1 acción","Personal","V, S, M","1 hora","Ritual. Entiendes el significado literal de cualquier idioma hablado que oigas, y de cualquier texto escrito que toques. No descifra mensajes ocultos ni símbolos arcanos."],["disguise-self","Disfrazarse","Disguise Self",1,"Ilusión","1 acción","Personal","V, S","1 hora","Cambias tu aspecto: ropa, armadura, armas, rasgos. Tu altura puede variar un pie y tu complexión cambiar. La ilusión no soporta el tacto; quien sospeche puede desmontarla con una prueba de Investigación contra tu CD."],["expeditious-retreat","Retirada Expeditiva","Expeditious Retreat",1,"Transmutación","1 acción adicional","Personal","V, S","Concentración, hasta 10 minutos","Puedes realizar la acción de Correr como acción adicional en cada uno de tus turnos mientras dure el conjuro."],["false-life","Vida Fingida","False Life",1,"Nigromancia","1 acción","Personal","V, S, M","1 hora","Ganas 1d4 + 4 puntos de golpe temporales. A niveles superiores: +5 temporales por cada nivel por encima del 1."],["feather-fall","Caída de Pluma","Feather Fall",1,"Transmutación","1 reacción","60 pies","V, M","1 minuto","Se lanza cuando tú o una criatura a 60 pies caéis. Hasta cinco criaturas que caigan descienden 60 pies por asalto y no reciben daño al aterrizar."],["fog-cloud","Nube de Niebla","Fog Cloud",1,"Conjuración","1 acción","120 pies","V, S","Concentración, hasta 1 hora","Creas una esfera de niebla de 20 pies de radio. El área queda fuertemente oscurecida. El viento fuerte la dispersa. A niveles superiores: +20 pies de radio por nivel."],["grease","Grasa","Grease",1,"Conjuración","1 acción","60 pies","V, S, M","1 minuto","Cubres un cuadrado de 10 pies de grasa resbaladiza: terreno difícil. Toda criatura que esté allí al aparecer, o que entre o termine su turno dentro, hace una salvación de Destreza o cae derribada."],["jump","Salto","Jump",1,"Transmutación","1 acción","Toque","V, S, M","1 minuto","La distancia de salto de la criatura que tocas se triplica mientras dure el conjuro."],["mage-armor","Armadura de Mago","Mage Armor",1,"Abjuración","1 acción","Toque","V, S, M","8 horas","Tocas a una criatura voluntaria que no lleve armadura: una fuerza protectora la rodea y su Clase de Armadura base pasa a ser 13 + su modificador de Destreza. Termina si se pone armadura o si la disipas."],["magic-missile","Proyectil Mágico","Magic Missile",1,"Evocación","1 acción","120 pies","V, S","Instantáneo","Creas tres dardos de fuerza brillante. Cada uno acierta automáticamente a una criatura que puedas ver e inflige 1d4 + 1 de daño de fuerza. A niveles superiores: un dardo más por cada nivel por encima del 1."],["ray-of-sickness","Rayo de Enfermedad","Ray of Sickness",1,"Nigromancia","1 acción","60 pies","V, S","Instantáneo","Ataque de conjuro a distancia: 2d8 de daño de veneno, y el objetivo hace una salvación de Constitución o queda envenenado hasta el final de tu siguiente turno. A niveles superiores: +1d8 por nivel."],["shield","Escudo","Shield",1,"Abjuración","1 reacción","Personal","V, S","1 asalto","Se lanza cuando te aciertan o te apunta un proyectil mágico. Una barrera invisible te da +5 a la Clase de Armadura, incluido contra el ataque que lo provocó, y anula por completo el proyectil mágico."],["silent-image","Imagen Silenciosa","Silent Image",1,"Ilusión","1 acción","60 pies","V, S, M","Concentración, hasta 10 minutos","Creas la imagen de un objeto, criatura o fenómeno visible de no más de 15 pies de lado. Es puramente visual: no hace ruido, ni huele, ni se puede tocar. Puedes moverla con una acción."],["sleep","Dormir","Sleep",1,"Encantamiento","1 acción","90 pies","V, S, M","1 minuto","Tiras 5d8: es el total de puntos de golpe de criaturas que duermes. Empezando por la que menos puntos actuales tenga, cada una cae inconsciente hasta que reciba daño o alguien la despierte. Los no-muertos y quien no pueda ser encantado son inmunes. A niveles superiores: +2d8 por nivel."],["thunderwave","Onda Atronadora","Thunderwave",1,"Evocación","1 acción","Personal (cubo de 15 pies)","V, S","Instantáneo","Una onda de fuerza atronadora sale de ti. Cada criatura del cubo hace una salvación de Constitución: 2d8 de daño de trueno y la empujas 10 pies si falla; mitad de daño y sin empuje si la supera. El estruendo se oye a 300 pies. A niveles superiores: +1d8 por nivel."],["witch-bolt","Descarga de Bruja","Witch Bolt",1,"Evocación","1 acción","30 pies","V, S, M","Concentración, hasta 1 minuto","Un rayo azul crea un arco entre tú y una criatura. Ataque de conjuro a distancia: 1d12 de daño de relámpago. En turnos siguientes puedes usar tu acción para infligir 1d12 automáticamente. A niveles superiores: +1d12 al daño inicial por nivel."],["tashas-hideous-laughter","Risa Horrible de Tasha","Tasha's Hideous Laughter",1,"Encantamiento","1 acción","30 pies","V, S, M","Concentración, hasta 1 minuto","Una criatura ve todo absurdo: si falla una salvación de Sabiduría, cae derribada e incapacitada, riendo a carcajadas. Repite la salvación al final de cada turno, con ventaja si recibió daño ese turno."],["find-familiar","Encontrar Familiar","Find Familiar",1,"Conjuración","1 hora","10 pies","V, S, M","Instantáneo","Ritual. Ganas un espíritu servicial con forma de bestia pequeña. Actúa por su cuenta pero obedece, os comunicáis telepáticamente a 100 pies, y puedes ver y oír por sus sentidos con una acción. Puedes lanzar conjuros de toque a través de él."],["unseen-servant","Sirviente Invisible","Unseen Servant",1,"Conjuración","1 acción","60 pies","V, S, M","1 hora","Ritual. Creas una fuerza invisible y obediente que hace tareas sencillas: limpiar, cargar, ir a buscar algo. Tiene FUE 2 y no puede atacar. Con una acción adicional le das órdenes."],["identify","Identificar","Identify",1,"Adivinación","1 minuto","Toque","V, S, M","Instantáneo","Ritual. Aprendes las propiedades de un objeto mágico que toques: cómo usarlo, si necesita sintonización, y cuántas cargas le quedan. Sobre una criatura, sabes qué conjuros la afectan."],["alter-self","Alterarse","Alter Self",2,"Transmutación","1 acción","Personal","V, S","Concentración, hasta 1 hora","Cambias tu forma: adaptación acuática (branquias y nado), aspecto cambiado (rasgos faciales, voz, altura) o arma natural (garra, colmillo o cuerno mágico de 1d6)."],["blindness-deafness","Ceguera/Sordera","Blindness/Deafness",2,"Nigromancia","1 acción","30 pies","V","1 minuto","Una criatura hace una salvación de Constitución o queda cegada o ensordecida, tú eliges. Repite la salvación al final de cada uno de sus turnos. A niveles superiores: un objetivo más por nivel."],["blur","Difuminar","Blur",2,"Ilusión","1 acción","Personal","V","Concentración, hasta 1 minuto","Tu cuerpo se vuelve borroso. Las criaturas tienen desventaja en las tiradas de ataque contra ti, salvo que no dependan de la vista o vean a través de ilusiones."],["cloud-of-daggers","Nube de Dagas","Cloud of Daggers",2,"Conjuración","1 acción","60 pies","V, S, M","Concentración, hasta 1 minuto","Llenas un cubo de 5 pies de dagas giratorias. Toda criatura que entre o empiece su turno dentro recibe 4d4 de daño cortante. A niveles superiores: +2d4 por nivel."],["crown-of-madness","Corona de Locura","Crown of Madness",2,"Encantamiento","1 acción","120 pies","V, S","Concentración, hasta 1 minuto","Un humanoide hace una salvación de Sabiduría o queda encantado: en cada uno de sus turnos debe atacar cuerpo a cuerpo a una criatura que tú elijas antes de moverse."],["darkness","Oscuridad","Darkness",2,"Evocación","1 acción","60 pies","V, M","Concentración, hasta 10 minutos","Oscuridad mágica se extiende 15 pies desde un punto. Ni la visión en la oscuridad la atraviesa, y la luz no mágica no la ilumina. Disipa luz mágica de nivel 2 o inferior."],["darkvision","Visión en la Oscuridad","Darkvision",2,"Transmutación","1 acción","Toque","V, S, M","8 horas","La criatura que tocas gana visión en la oscuridad hasta 60 pies mientras dure el conjuro."],["detect-thoughts","Detectar Pensamientos","Detect Thoughts",2,"Adivinación","1 acción","Personal","V, S, M","Concentración, hasta 1 minuto","Lees los pensamientos superficiales de una criatura a 30 pies. Con otra acción puedes escarbar más hondo: hace una salvación de Sabiduría o accedes a sus razonamientos y sus miedos."],["enhance-ability","Mejorar Característica","Enhance Ability",2,"Transmutación","1 acción","Toque","V, S, M","Concentración, hasta 1 hora","Una criatura gana ventaja en las pruebas de una característica que elijas. Con Constitución además gana 2d6 puntos de golpe temporales; con Fuerza dobla su capacidad de carga. A niveles superiores: un objetivo más por nivel."],["enlarge-reduce","Agrandar/Reducir","Enlarge/Reduce",2,"Transmutación","1 acción","30 pies","V, S, M","Concentración, hasta 1 minuto","Agrandar: la criatura dobla su tamaño, gana ventaja en pruebas y salvaciones de Fuerza, y suma 1d4 al daño con arma. Reducir: se reduce a la mitad, con desventaja en Fuerza y −1d4 al daño."],["gust-of-wind","Ráfaga de Viento","Gust of Wind",2,"Evocación","1 acción","Personal (línea de 60 pies)","V, S, M","Concentración, hasta 1 minuto","Un vendaval sopla en línea recta. Las criaturas de la línea hacen una salvación de Fuerza o son empujadas 15 pies. Moverse contra el viento cuesta el doble, y apaga llamas no protegidas."],["invisibility","Invisibilidad","Invisibility",2,"Ilusión","1 acción","Toque","V, S, M","Concentración, hasta 1 hora","La criatura que tocas se vuelve invisible, junto con lo que lleve encima. Termina si ataca o lanza un conjuro. A niveles superiores: un objetivo más por nivel."],["knock","Abrir","Knock",2,"Transmutación","1 acción","60 pies","V","Instantáneo","Un objeto cerrado se abre: cerrojos descorridos, barras levantadas, cerraduras abiertas. Un conjuro de cerradura arcana queda suspendido 10 minutos. Suena un golpe fuerte que se oye a 300 pies."],["levitate","Levitar","Levitate",2,"Transmutación","1 acción","60 pies","V, S, M","Concentración, hasta 10 minutos","Una criatura u objeto de hasta 500 libras se eleva hasta 20 pies. Si es una criatura no voluntaria, hace una salvación de Constitución. Puedes subirla o bajarla 20 pies con una acción."],["mirror-image","Imagen Múltiple","Mirror Image",2,"Ilusión","1 acción","Personal","V, S","1 minuto","Aparecen tres duplicados tuyos. Cada vez que te apunten, tira para ver si acierta a un duplicado: con tres, un 6 o más en 1d20; con dos, un 8; con uno, un 11. Un duplicado tiene CA 10 + tu modificador de Destreza y desaparece al ser acertado."],["phantasmal-force","Fuerza Fantasmal","Phantasmal Force",2,"Ilusión","1 acción","60 pies","V, S, M","Concentración, hasta 1 minuto","Una criatura hace una salvación de Inteligencia o creas en su mente una ilusión que solo ella percibe, con todos los sentidos. Si es dañina, le inflige 1d6 de daño psíquico por turno."],["scorching-ray","Rayo Abrasador","Scorching Ray",2,"Evocación","1 acción","120 pies","V, S","Instantáneo","Creas tres rayos de fuego y los repartes entre uno o varios objetivos. Haz un ataque de conjuro a distancia por cada rayo: 2d6 de daño de fuego al acertar. A niveles superiores: un rayo más por nivel."],["see-invisibility","Ver lo Invisible","See Invisibility",2,"Adivinación","1 acción","Personal","V, S, M","1 hora","Ves las criaturas y objetos invisibles como si fueran visibles, y ves a través del plano Etéreo: esas criaturas te aparecen como formas translúcidas."],["shatter","Estrépito","Shatter",2,"Evocación","1 acción","60 pies","V, S, M","Instantáneo","Un estruendo doloroso brota en una esfera de 10 pies de radio. Cada criatura dentro hace una salvación de Constitución: 3d8 de daño de trueno si falla, mitad si la supera. Las criaturas de material inorgánico tienen desventaja. A niveles superiores: +1d8 por nivel."],["spider-climb","Trepar como Arácnido","Spider Climb",2,"Transmutación","1 acción","Toque","V, S, M","Concentración, hasta 1 hora","La criatura que tocas puede moverse por superficies verticales y por el techo, con las manos libres, y gana velocidad de trepar igual a su velocidad de caminar."],["suggestion","Sugestión","Suggestion",2,"Encantamiento","1 acción","30 pies","V, M","Concentración, hasta 8 horas","Sugieres un curso de acción en una o dos frases razonables. Si la criatura falla una salvación de Sabiduría, hace todo lo posible por seguirla. Una sugerencia manifiestamente dañina anula el conjuro."],["web","Telaraña","Web",2,"Conjuración","1 acción","60 pies","V, S, M","Concentración, hasta 1 hora","Llenas un cubo de 20 pies de telarañas espesas: terreno difícil y área ligeramente oscurecida. Quien entre o empiece su turno dentro hace una salvación de Destreza o queda apresado. Arden en 1 asalto si les prendes fuego."],["magic-mouth","Boca Mágica","Magic Mouth",2,"Ilusión","1 minuto","30 pies","V, S, M","Hasta que se disipe","Ritual. Implantas un mensaje de hasta 25 palabras en un objeto. Se recita cuando se cumple la condición que fijaste: una boca aparece en el objeto y habla con tu voz."],["blink","Parpadeo","Blink",3,"Transmutación","1 acción","Personal","V, S","1 minuto","Al final de cada uno de tus turnos tiras 1d20: con 11 o más desapareces al plano Etéreo. Vuelves al inicio de tu siguiente turno. Mientras estás fuera, nada del plano Material puede verte ni afectarte."],["clairvoyance","Clarividencia","Clairvoyance",3,"Adivinación","10 minutos","1 milla","V, S, M","Concentración, hasta 10 minutos","Creas un sensor invisible en un lugar que conozcas o que puedas ver. Eliges si oír o ver por él, y puedes cambiar entre ambos con una acción."],["counterspell","Contraconjuro","Counterspell",3,"Abjuración","1 reacción","60 pies","S","Instantáneo","Se lanza cuando ves a una criatura lanzando un conjuro. Si el suyo es de nivel 3 o inferior, falla automáticamente. Si es superior, haz una prueba con tu característica de lanzamiento contra CD 10 + su nivel."],["fear","Miedo","Fear",3,"Ilusión","1 acción","Personal (cono de 30 pies)","V, S, M","Concentración, hasta 1 minuto","Cada criatura del cono hace una salvación de Sabiduría o suelta lo que lleve y queda asustada: en cada turno debe usar la acción de Correr para alejarse de ti."],["fireball","Bola de Fuego","Fireball",3,"Evocación","1 acción","150 pies","V, S, M","Instantáneo","Una perla de fuego estalla en una esfera de 20 pies de radio. Cada criatura dentro hace una salvación de Destreza: 8d6 de daño de fuego si falla, mitad si la supera. Prende los objetos inflamables que nadie lleve. A niveles superiores: +1d6 por nivel."],["fly","Volar","Fly",3,"Transmutación","1 acción","Toque","V, S, M","Concentración, hasta 10 minutos","La criatura que tocas gana velocidad de vuelo de 60 pies. Si el conjuro acaba mientras vuela, cae. A niveles superiores: un objetivo más por nivel."],["gaseous-form","Forma Gaseosa","Gaseous Form",3,"Transmutación","1 acción","Toque","V, S, M","Concentración, hasta 1 hora","Una criatura voluntaria y lo que lleve se vuelven niebla: resistencia al daño no mágico, ventaja en salvaciones de Fuerza, Destreza y Constitución, y puede atravesar cualquier hueco. No puede atacar ni lanzar conjuros."],["hypnotic-pattern","Patrón Hipnótico","Hypnotic Pattern",3,"Ilusión","1 acción","120 pies","S, M","Concentración, hasta 1 minuto","Un patrón de colores retorcidos llena un cubo de 30 pies. Las criaturas dentro hacen una salvación de Sabiduría o quedan encantadas: incapacitadas y con velocidad 0. Termina si alguna recibe daño o si un aliado la sacude."],["lightning-bolt","Relámpago","Lightning Bolt",3,"Evocación","1 acción","Personal (línea de 100 pies)","V, S, M","Instantáneo","Un rayo de 5 pies de ancho sale de ti. Cada criatura de la línea hace una salvación de Destreza: 8d6 de daño de relámpago si falla, mitad si la supera. A niveles superiores: +1d6 por nivel."],["major-image","Imagen Mayor","Major Image",3,"Ilusión","1 acción","120 pies","V, S, M","Concentración, hasta 10 minutos","Creas la imagen de un objeto, criatura o fenómeno de hasta 20 pies de lado, con sonido, olor y temperatura. Parece real hasta que alguien la atraviesa o supera una prueba de Investigación contra tu CD."],["sleet-storm","Tormenta de Aguanieve","Sleet Storm",3,"Conjuración","1 acción","150 pies","V, S, M","Concentración, hasta 1 minuto","Aguanieve helada cae en un cilindro de 40 pies de radio: el área queda ligeramente oscurecida, el suelo es terreno difícil, las llamas se apagan, y quien entre o empiece su turno dentro hace una salvación de Destreza o cae derribado."],["slow","Ralentizar","Slow",3,"Transmutación","1 acción","120 pies","V, S, M","Concentración, hasta 1 minuto","Hasta seis criaturas en un cubo de 40 pies hacen una salvación de Sabiduría. Las que fallen ven su velocidad reducida a la mitad, sufren −2 a la CA y a las salvaciones de Destreza, y no pueden reaccionar."],["stinking-cloud","Nube Hedionda","Stinking Cloud",3,"Conjuración","1 acción","90 pies","V, S, M","Concentración, hasta 1 minuto","Un gas nauseabundo llena una esfera de 20 pies de radio. Quien empiece su turno dentro hace una salvación de Constitución o pierde su acción, ahogándose y con arcadas."],["tongues","Lenguas","Tongues",3,"Adivinación","1 acción","Toque","V, M","1 hora","La criatura que tocas entiende cualquier idioma hablado que oiga, y cualquiera que la oiga entiende lo que dice."],["water-breathing","Respirar bajo el Agua","Water Breathing",3,"Transmutación","1 acción","30 pies","V, S, M","24 horas","Ritual. Hasta diez criaturas voluntarias pueden respirar bajo el agua mientras dure el conjuro, sin perder su respiración normal."],["water-walk","Caminar sobre el Agua","Water Walk",3,"Transmutación","1 acción","30 pies","V, S, M","1 hora","Ritual. Hasta diez criaturas pueden moverse por cualquier superficie líquida —agua, ácido, barro, lava— como si fuera suelo firme."]],ch=[["acid-splash","Salpicadura Ácida","Acid Splash",0,"Conjuración","1 acción","60 pies","V, S","Instantáneo","Lanzas una burbuja de ácido a una criatura, o a dos que estén a 5 pies o menos una de otra. Cada objetivo hace una salvación de Destreza o recibe 1d6 de daño de ácido."],["blade-ward","Guarda contra Hojas","Blade Ward",0,"Abjuración","1 acción","Personal","V, S","1 asalto","Hasta el final de tu siguiente turno tienes resistencia al daño contundente, perforante y cortante de ataques con arma."],["chill-touch","Toque Gélido","Chill Touch",0,"Nigromancia","1 acción","120 pies","V, S","1 asalto","Una mano esquelética agarra a la criatura. Ataque de conjuro a distancia: 1d8 de daño necrótico y no puede recuperar puntos de golpe hasta el inicio de tu siguiente turno. Si es no-muerta, además tiene desventaja en sus ataques contra ti ese turno."],["dancing-lights","Luces Danzantes","Dancing Lights",0,"Evocación","1 acción","120 pies","V, S, M","Concentración, hasta 1 minuto","Creas hasta cuatro luces del tamaño de antorchas, o una figura luminosa vagamente humanoide. Cada una emite luz tenue en 10 pies y puedes moverlas 60 pies con una acción adicional."],["fire-bolt","Rayo de Fuego","Fire Bolt",0,"Evocación","1 acción","120 pies","V, S","Instantáneo","Lanzas una mota de fuego. Ataque de conjuro a distancia: 1d10 de daño de fuego. Los objetos inflamables que nadie lleve encima se prenden."],["friends","Amigos","Friends",0,"Encantamiento","1 acción","Personal","S, M","Concentración, hasta 1 minuto","Ganas ventaja en las pruebas de Carisma contra una criatura que no sea hostil. Cuando el conjuro acaba, la criatura sabe que la has encantado y decide cómo reaccionar: puede volverse hostil."],["light","Luz","Light",0,"Evocación","1 acción","Toque","V, M","1 hora","Un objeto que no supere los 10 pies emite luz brillante en 20 pies y luz tenue 20 pies más. Si el objeto lo lleva una criatura hostil, hace una salvación de Destreza para evitarlo."],["mage-hand","Mano de Mago","Mage Hand",0,"Conjuración","1 acción","30 pies","V, S","1 minuto","Aparece una mano espectral. Con una acción puedes manipular objetos, abrir contenedores sin cerrar, guardar o sacar algo, o verter el contenido de un frasco. Puede mover hasta 10 libras. No puede atacar ni activar objetos mágicos."],["mending","Remendar","Mending",0,"Transmutación","1 minuto","Toque","V, S, M","Instantáneo","Reparas una rotura o desgarro de un objeto: un eslabón de cadena, una llave partida, una capa rasgada, un odre agujereado. No repara constructos ni objetos mágicos."],["message","Mensaje","Message",0,"Transmutación","1 acción","120 pies","V, S, M","1 asalto","Señalas a una criatura y le susurras un mensaje que solo ella oye. Puede responderte en un susurro que solo tú oyes."],["minor-illusion","Ilusión Menor","Minor Illusion",0,"Ilusión","1 acción","30 pies","S, M","1 minuto","Creas un sonido o la imagen de un objeto de no más de 5 pies de lado. Quien la examine con una acción y supere una prueba de Investigación contra tu CD, la ve por lo que es."],["poison-spray","Rociada Venenosa","Poison Spray",0,"Conjuración","1 acción","10 pies","V, S","Instantáneo","Extiendes la mano hacia una criatura y sueltas una nube de gas tóxico. Hace una salvación de Constitución o recibe 1d12 de daño de veneno."],["prestidigitation","Prestidigitación","Prestidigitation",0,"Transmutación","1 acción","10 pies","V, S","Hasta 1 hora","Un truco menor: una chispa o una brisa, encender o apagar una vela, limpiar o ensuciar un objeto, enfriar o calentar comida, dar color a algo durante 1 hora, o crear una baratija ilusoria."],["ray-of-frost","Rayo de Escarcha","Ray of Frost",0,"Evocación","1 acción","60 pies","V, S","Instantáneo","Un haz de luz azul y frío. Ataque de conjuro a distancia: 1d8 de daño de frío, y la velocidad del objetivo baja 10 pies hasta el inicio de tu siguiente turno."],["shocking-grasp","Contacto Electrizante","Shocking Grasp",0,"Evocación","1 acción","Toque","V, S","Instantáneo","Relámpago desde tu mano. Ataque de conjuro cuerpo a cuerpo con ventaja si el objetivo lleva armadura metálica: 1d8 de daño de relámpago y no puede reaccionar hasta el inicio de su siguiente turno."],["true-strike","Golpe Certero","True Strike",0,"Adivinación","1 acción","30 pies","S","Concentración, hasta 1 asalto","Tu magia te muestra las defensas del objetivo: ganas ventaja en tu primera tirada de ataque contra él en tu siguiente turno."],["sacred-flame","Llama Sagrada","Sacred Flame",0,"Evocación","1 acción","60 pies","V, S","Instantáneo","Un resplandor cae sobre una criatura, que hace una salvación de Destreza sin beneficio de cobertura o recibe 1d8 de daño radiante."],["guidance","Guía","Guidance",0,"Adivinación","1 acción","Toque","V, S","Concentración, hasta 1 minuto","Una criatura voluntaria que tocas puede tirar 1d4 y sumarlo a una prueba de característica de su elección antes de que el conjuro termine."],["thaumaturgy","Taumaturgia","Thaumaturgy",0,"Transmutación","1 acción","30 pies","V","Hasta 1 minuto","Manifiestas un signo menor de poder sobrenatural: tu voz truena, las llamas cambian de color, el suelo tiembra, o una puerta se abre de golpe."],["spare-the-dying","Estabilizar","Spare the Dying",0,"Nigromancia","1 acción","Toque","V, S","Instantáneo","Tocas a una criatura viva que esté a 0 puntos de golpe y queda estabilizada. No funciona con no-muertos ni constructos."],["resistance","Resistencia","Resistance",0,"Abjuración","1 acción","Toque","V, S, M","Concentración, hasta 1 minuto","Una criatura voluntaria que tocas puede tirar 1d4 y sumarlo a una tirada de salvación de su elección antes de que el conjuro termine."],["mind-sliver","Esquirla Mental","Mind Sliver",0,"Encantamiento","1 acción","60 pies","V","1 asalto","Clavas una astilla de sonido disonante en la mente de una criatura. Hace una salvación de Inteligencia o recibe 1d6 de daño psíquico y resta 1d4 a su siguiente tirada de salvación, antes del final de tu próximo turno."]],dh={"acid-splash":["1d6","2d6","3d6","4d6"],"chill-touch":["1d8","2d8","3d8","4d8"],"fire-bolt":["1d10","2d10","3d10","4d10"],"poison-spray":["1d12","2d12","3d12","4d12"],"ray-of-frost":["1d8","2d8","3d8","4d8"],"shocking-grasp":["1d8","2d8","3d8","4d8"],"sacred-flame":["1d8","2d8","3d8","4d8"],"mind-sliver":["1d6","2d6","3d6","4d6"]},mh=[["bless","Bendición","Bless",1,"Encantamiento","1 acción","30 pies","V, S, M","Concentración, hasta 1 minuto","Bendices hasta tres criaturas. Cada vez que una haga una tirada de ataque o de salvación antes de que el conjuro termine, tira 1d4 y suma el resultado."],["command","Orden","Command",1,"Encantamiento","1 acción","60 pies","V","1 asalto","Das una orden de una palabra a una criatura que puedas ver. Si falla una salvación de Sabiduría, la obedece en su siguiente turno. Sin efecto si no entiende tu idioma o si la orden es directamente dañina para ella."],["compelled-duel","Duelo Obligado","Compelled Duel",1,"Encantamiento","1 acción adicional","30 pies","V","Concentración, hasta 1 minuto","Una criatura debe superar una salvación de Sabiduría o quedar atada a ti: tiene desventaja en ataques contra cualquiera que no seas tú, y no puede alejarse voluntariamente a más de 30 pies de ti."],["cure-wounds","Curar Heridas","Cure Wounds",1,"Evocación","1 acción","Toque","V, S","Instantáneo","Una criatura que tocas recupera 1d8 + tu modificador de característica de lanzamiento en puntos de golpe. Sin efecto sobre no-muertos ni constructos. A niveles superiores: +1d8 por cada nivel por encima del 1."],["detect-evil-and-good","Detectar el Bien y el Mal","Detect Evil and Good",1,"Adivinación","1 acción","Personal","V, S","Concentración, hasta 10 minutos","Percibes la presencia de aberraciones, celestiales, elementales, feéricos, fiends y no-muertos a 30 pies, así como lugares u objetos consagrados o profanados. No sabes qué criatura es cuál."],["detect-magic","Detectar Magia","Detect Magic",1,"Adivinación","1 acción","Personal","V, S","Concentración, hasta 10 minutos","Percibes la presencia de magia a 30 pies. Con una acción puedes ver un aura tenue alrededor de la criatura u objeto mágico y saber su escuela."],["detect-poison-and-disease","Detectar Venenos y Enfermedades","Detect Poison and Disease",1,"Adivinación","1 acción","Personal","V, S, M","Concentración, hasta 10 minutos","Percibes la ubicación de venenos, criaturas venenosas y enfermedades a 30 pies, y qué tipo de veneno o enfermedad es cada uno."],["divine-favor","Favor Divino","Divine Favor",1,"Evocación","1 acción adicional","Personal","V, S","Concentración, hasta 1 minuto","Tu arma brilla con luz. Hasta que el conjuro termine, tus ataques con arma infligen 1d4 de daño radiante adicional al acertar."],["heroism","Heroísmo","Heroism",1,"Encantamiento","1 acción","Toque","V, S","Concentración, hasta 1 minuto","Una criatura voluntaria queda inmune a ser asustada y gana puntos de golpe temporales iguales a tu modificador de característica de lanzamiento al inicio de cada uno de sus turnos."],["protection-from-evil-and-good","Protección contra el Bien y el Mal","Protection from Evil and Good",1,"Abjuración","1 acción","Toque","V, S, M","Concentración, hasta 10 minutos","Aberraciones, celestiales, elementales, feéricos, fiends y no-muertos tienen desventaja en tiradas de ataque contra el objetivo, y no pueden encantarlo, asustarlo ni poseerlo."],["purify-food-and-drink","Purificar Comida y Bebida","Purify Food and Drink",1,"Transmutación","1 acción","10 pies","V, S","Instantáneo","Toda comida y bebida no mágica en una esfera de 5 pies de radio queda purificada: libre de veneno y enfermedad."],["searing-smite","Castigo Abrasador","Searing Smite",1,"Evocación","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque cuerpo a cuerpo que aciertes inflige 1d6 de daño de fuego adicional y prende al objetivo: al inicio de cada turno recibe 1d6 de fuego hasta que supere una salvación de Constitución. A niveles superiores: +1d6 por nivel."],["shield-of-faith","Escudo de Fe","Shield of Faith",1,"Abjuración","1 acción adicional","60 pies","V, S, M","Concentración, hasta 10 minutos","Un campo brillante rodea a una criatura y le otorga +2 a la Clase de Armadura mientras dure el conjuro."],["thunderous-smite","Castigo Atronador","Thunderous Smite",1,"Evocación","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque cuerpo a cuerpo que aciertes inflige 2d6 de daño de trueno adicional. El objetivo debe superar una salvación de Fuerza o quedar derribado y empujado 10 pies."],["wrathful-smite","Castigo Iracundo","Wrathful Smite",1,"Evocación","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque cuerpo a cuerpo que aciertes inflige 1d6 de daño psíquico adicional. El objetivo debe superar una salvación de Sabiduría o quedar asustado de ti."],["aid","Auxilio","Aid",2,"Abjuración","1 acción","30 pies","V, S, M","8 horas","Hasta tres criaturas aumentan su máximo de puntos de golpe y sus puntos actuales en 5 durante 8 horas. A niveles superiores: +5 por cada nivel por encima del 2."],["branding-smite","Castigo Marcador","Branding Smite",2,"Evocación","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque con arma que aciertes inflige 2d6 de daño radiante adicional y el objetivo emite luz tenue en 5 pies, sin poder volverse invisible. A niveles superiores: +1d6 por nivel."],["find-steed","Encontrar Montura","Find Steed",2,"Conjuración","10 minutos","30 pies","V, S","Instantáneo","Invocas un espíritu que toma la forma de una montura leal y excepcionalmente inteligente, creando un vínculo con ella. Mientras esté a 1 milla, os comunicáis telepáticamente."],["lesser-restoration","Restauración Menor","Lesser Restoration",2,"Abjuración","1 acción","Toque","V, S","Instantáneo","Terminas una enfermedad o una condición que aflija a la criatura que tocas: cegada, ensordecida, paralizada o envenenada."],["locate-object","Localizar Objeto","Locate Object",2,"Adivinación","1 acción","Personal","V, S, M","Concentración, hasta 10 minutos","Percibes la dirección de un objeto que conozcas si está a 1000 pies o menos. Bloqueado por al menos 3 pies de madera, 1 pie de piedra o una fina lámina de plomo."],["magic-weapon","Arma Mágica","Magic Weapon",2,"Transmutación","1 acción adicional","Toque","V, S","Concentración, hasta 1 hora","Un arma no mágica se vuelve mágica con +1 a ataque y daño. A nivel 4 el bonificador es +2; a nivel 6, +3."],["protection-from-poison","Protección contra el Veneno","Protection from Poison",2,"Abjuración","1 acción","Toque","V, S","1 hora","Neutralizas un veneno que afecte a la criatura que tocas. Durante 1 hora tiene ventaja en salvaciones contra ser envenenada y resistencia al daño de veneno."],["warding-bond","Vínculo Protector","Warding Bond",2,"Abjuración","1 acción","Toque","V, S, M","1 hora","Una criatura voluntaria gana +1 a la CA y a las salvaciones, y resistencia a todo el daño. Cada vez que reciba daño, tú recibes la misma cantidad. Se rompe a más de 60 pies."],["zone-of-truth","Zona de Verdad","Zone of Truth",2,"Encantamiento","1 acción","60 pies","V, S","10 minutos","Creas una esfera de 15 pies de radio. Las criaturas dentro que fallen una salvación de Carisma no pueden mentir deliberadamente. Sabes quién superó la salvación."],["aura-of-vitality","Aura de Vitalidad","Aura of Vitality",3,"Evocación","1 acción","Personal","V","Concentración, hasta 1 minuto","Emanas energía sanadora en 30 pies. Como acción adicional puedes curar 2d6 puntos de golpe a una criatura del aura."],["blinding-smite","Castigo Cegador","Blinding Smite",3,"Evocación","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque cuerpo a cuerpo que aciertes inflige 3d8 de daño radiante adicional y el objetivo debe superar una salvación de Constitución o quedar cegado."],["create-food-and-water","Crear Comida y Agua","Create Food and Water",3,"Conjuración","1 acción","30 pies","V, S","Instantáneo","Creas 45 libras de comida y 30 galones de agua, suficiente para quince humanoides o cinco monturas durante 24 horas."],["crusaders-mantle","Manto del Cruzado","Crusader's Mantle",3,"Evocación","1 acción","Personal","V","Concentración, hasta 1 minuto","Emanas energía divina en 30 pies. Las criaturas amistosas del aura infligen 1d4 de daño radiante adicional con sus ataques con arma."],["daylight","Luz del Día","Daylight",3,"Evocación","1 acción","60 pies","V, S","1 hora","Un punto emite luz brillante en 60 pies de radio y luz tenue 60 pies más. Disipa oscuridad mágica de nivel 3 o inferior dentro del área."],["dispel-magic","Disipar Magia","Dispel Magic",3,"Abjuración","1 acción","120 pies","V, S","Instantáneo","Terminas todo conjuro de nivel 3 o inferior sobre el objetivo. Para conjuros superiores, haz una prueba con tu característica de lanzamiento contra CD 10 + nivel del conjuro."],["elemental-weapon","Arma Elemental","Elemental Weapon",3,"Transmutación","1 acción","Toque","V, S","Concentración, hasta 1 hora","Un arma no mágica gana +1 a ataque y 1d4 de daño de un tipo elemental que elijas. A niveles 5-6: +2 y 2d4. A niveles 7+: +3 y 3d4."],["magic-circle","Círculo Mágico","Magic Circle",3,"Abjuración","1 minuto","10 pies","V, S, M","1 hora","Un cilindro de 10 pies de radio y 20 de alto impide que celestiales, elementales, feéricos, fiends o no-muertos entren, y les da desventaja en ataques contra quien esté dentro."],["remove-curse","Levantar Maldición","Remove Curse",3,"Abjuración","1 acción","Toque","V, S","Instantáneo","Termina toda maldición sobre la criatura u objeto que tocas. Un objeto maldito sigue siéndolo, pero se rompe su vínculo con el portador."],["revivify","Revivificar","Revivify",3,"Nigromancia","1 acción","Toque","V, S, M","Instantáneo","Devuelves la vida a una criatura que murió hace menos de 1 minuto, con 1 punto de golpe. No restaura partes del cuerpo perdidas. Consume 300 po en diamantes."],["aura-of-life","Aura de Vida","Aura of Life",4,"Abjuración","1 acción","Personal","V","Concentración, hasta 10 minutos","Emanas energía en 30 pies. Las criaturas amistosas del aura tienen resistencia al daño necrótico y su máximo de puntos de golpe no puede reducirse. Las que estén a 0 recuperan 1 al inicio de su turno."],["aura-of-purity","Aura de Pureza","Aura of Purity",4,"Abjuración","1 acción","Personal","V","Concentración, hasta 10 minutos","Las criaturas amistosas a 30 pies no pueden contraer enfermedades, tienen resistencia al daño de veneno y ventaja en salvaciones contra numerosas condiciones."],["banishment","Destierro","Banishment",4,"Abjuración","1 acción","60 pies","V, S, M","Concentración, hasta 1 minuto","Una criatura debe superar una salvación de Carisma o ser desterrada a un semiplano inofensivo. A niveles superiores: un objetivo más por cada nivel por encima del 4."],["death-ward","Guarda contra la Muerte","Death Ward",4,"Abjuración","1 acción","Toque","V, S","8 horas","La primera vez que la criatura fuese a caer a 0 puntos de golpe, cae a 1 en su lugar. Si algo la mataría directamente, el efecto falla."],["locate-creature","Localizar Criatura","Locate Creature",4,"Adivinación","1 acción","Personal","V, S, M","Concentración, hasta 1 hora","Percibes la dirección de una criatura conocida si está a 1000 pies o menos. Bloqueado por agua corriente de al menos 10 pies de ancho."],["staggering-smite","Castigo Aturdidor","Staggering Smite",4,"Evocación","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque cuerpo a cuerpo que aciertes inflige 4d6 de daño psíquico adicional. Si falla una salvación de Sabiduría, el objetivo tiene desventaja en ataques y pruebas y no puede reaccionar durante un turno."],["banishing-smite","Castigo Desterrador","Banishing Smite",5,"Abjuración","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque con arma que aciertes inflige 5d10 de daño de fuerza adicional. Si eso deja al objetivo por debajo de 50 puntos de golpe, queda desterrado mientras dure el conjuro."],["circle-of-power","Círculo de Poder","Circle of Power",5,"Abjuración","1 acción","Personal","V","Concentración, hasta 10 minutos","Las criaturas amistosas a 30 pies tienen ventaja en salvaciones contra conjuros y efectos mágicos, y no reciben daño alguno cuando una salvación exitosa normalmente reduciría el daño a la mitad."],["destructive-wave","Onda Destructiva","Destructive Wave",5,"Evocación","1 acción","Personal","V","Instantáneo","Golpeas el suelo. Cada criatura que elijas a 30 pies hace una salvación de Constitución: si falla, recibe 5d6 de daño de trueno más 5d6 radiante o necrótico (tú eliges) y queda derribada. Mitad de daño si la supera."],["dispel-evil-and-good","Disipar el Bien y el Mal","Dispel Evil and Good",5,"Abjuración","1 acción","Personal","V, S, M","Concentración, hasta 1 minuto","Celestiales, elementales, feéricos, fiends y no-muertos tienen desventaja en ataques contra ti. Puedes gastar el conjuro para romper un encantamiento o para intentar desterrar a una de estas criaturas que toques."],["geas","Imposición","Geas",5,"Encantamiento","1 minuto","60 pies","V","30 días","Ordenas a una criatura que realice un servicio o se abstenga de una acción. Si falla una salvación de Sabiduría queda obligada; si desobedece, recibe 5d10 de daño psíquico una vez al día."],["raise-dead","Alzar a los Muertos","Raise Dead",5,"Nigromancia","1 hora","Toque","V, S, M","Instantáneo","Devuelves la vida a una criatura muerta hace menos de 10 días, con 1 punto de golpe. Sufre −4 a tiradas de ataque, salvaciones y pruebas, que se reduce en 1 por cada descanso largo. Consume un diamante de 500 po."],["sanctuary","Santuario","Sanctuary",1,"Abjuración","1 acción adicional","30 pies","V, S, M","1 minuto","Una criatura queda protegida: quien la ataque debe superar una salvación de Sabiduría o elegir otro objetivo. Termina si la criatura protegida ataca o lanza un conjuro dañino."],["ensnaring-strike","Golpe Atrapador","Ensnaring Strike",1,"Conjuración","1 acción adicional","Personal","V","Concentración, hasta 1 minuto","El siguiente ataque con arma que aciertes hace brotar zarzas: el objetivo debe superar una salvación de Fuerza o quedar apresado, recibiendo 1d6 de daño perforante al inicio de cada turno."],["speak-with-animals","Hablar con los Animales","Speak with Animals",1,"Adivinación","1 acción","Personal","V, S","10 minutos","Ritual. Puedes comprender y comunicarte verbalmente con bestias. Su conocimiento y percepción están limitados por su inteligencia."],["bane","Perdición","Bane",1,"Encantamiento","1 acción","30 pies","V, S, M","Concentración, hasta 1 minuto","Hasta tres criaturas que fallen una salvación de Carisma restan 1d4 a cada tirada de ataque y de salvación que hagan mientras dure el conjuro."],["hunters-mark","Marca del Cazador","Hunter's Mark",1,"Adivinación","1 acción adicional","90 pies","V","Concentración, hasta 1 hora","Marcas a una criatura: infliges 1d6 de daño adicional al acertarla con un ataque con arma, y tienes ventaja en pruebas de Percepción y Supervivencia para encontrarla."],["misty-step","Paso Brumoso","Misty Step",2,"Conjuración","1 acción adicional","Personal","V","Instantáneo","Envuelto en niebla plateada, te teletransportas hasta 30 pies a un espacio desocupado que puedas ver."],["moonbeam","Rayo de Luna","Moonbeam",2,"Evocación","1 acción","120 pies","V, S, M","Concentración, hasta 1 minuto","Un cilindro de luz plateada de 5 pies de radio y 40 de alto. Al entrar o empezar el turno dentro, una criatura hace una salvación de Constitución: 2d10 de daño radiante si falla, mitad si la supera."],["hold-person","Inmovilizar Persona","Hold Person",2,"Encantamiento","1 acción","60 pies","V, S, M","Concentración, hasta 1 minuto","Un humanoide debe superar una salvación de Sabiduría o quedar paralizado. Repite la salvación al final de cada uno de sus turnos."],["beacon-of-hope","Faro de Esperanza","Beacon of Hope",3,"Abjuración","1 acción","30 pies","V, S","Concentración, hasta 1 minuto","Las criaturas que elijas ganan ventaja en salvaciones de Sabiduría y de muerte, y recuperan el máximo posible de puntos de golpe con cualquier curación."],["plant-growth","Crecimiento Vegetal","Plant Growth",3,"Transmutación","1 acción o 8 horas","150 pies","V, S","Instantáneo","La vegetación en 100 pies de radio se vuelve densa: moverse por ella cuesta 4 pies de movimiento por cada pie recorrido. Con 8 horas, enriqueces la tierra para una cosecha."],["protection-from-energy","Protección contra la Energía","Protection from Energy",3,"Abjuración","1 acción","Toque","V, S","Concentración, hasta 1 hora","La criatura que tocas gana resistencia a un tipo de daño que elijas: ácido, frío, fuego, relámpago o trueno."],["haste","Prisa","Haste",3,"Transmutación","1 acción","30 pies","V, S, M","Concentración, hasta 1 minuto","Una criatura voluntaria dobla su velocidad, gana +2 a la CA, ventaja en salvaciones de Destreza y una acción adicional limitada cada turno. Al terminar, no puede moverse ni actuar durante un turno."],["freedom-of-movement","Libertad de Movimiento","Freedom of Movement",4,"Abjuración","1 acción","Toque","V, S, M","1 hora","El terreno difícil no cuesta movimiento extra a la criatura, y conjuros y efectos no pueden reducir su velocidad ni dejarla paralizada o apresada. Puede gastar 5 pies para escapar de un agarre."],["guardian-of-faith","Guardián de la Fe","Guardian of Faith",4,"Conjuración","1 acción","30 pies","V","8 horas","Un guardián espectral de gran tamaño aparece. Los enemigos que se acerquen a 10 pies hacen una salvación de Destreza: 20 de daño radiante si fallan, mitad si la superan. Desaparece tras infligir 60 de daño en total."],["ice-storm","Tormenta de Hielo","Ice Storm",4,"Evocación","1 acción","300 pies","V, S, M","Instantáneo","Granizo brutal cae en un cilindro de 20 pies de radio: 2d8 contundente y 4d6 de frío en una salvación de Destreza fallida, mitad si la superan. El área se vuelve terreno difícil."],["stoneskin","Piel Pétrea","Stoneskin",4,"Abjuración","1 acción","Toque","V, S, M","Concentración, hasta 1 hora","La piel de una criatura voluntaria se endurece: gana resistencia al daño contundente, perforante y cortante no mágico."],["dimension-door","Puerta Dimensional","Dimension Door",4,"Conjuración","1 acción","500 pies","V","Instantáneo","Te teletransportas hasta 500 pies a un lugar que puedas visualizar. Puedes llevar contigo a una criatura voluntaria de tu tamaño o menor."],["commune","Comunión","Commune",5,"Adivinación","1 minuto","Personal","V, S, M","1 minuto","Ritual. Contactas con tu deidad y haces hasta tres preguntas de sí o no. Usarlo más de una vez entre descansos largos arriesga respuestas falsas."],["flame-strike","Columna de Fuego","Flame Strike",5,"Evocación","1 acción","60 pies","V, S, M","Instantáneo","Una columna de fuego divino de 10 pies de radio y 40 de alto: 4d6 de fuego y 4d6 radiante en una salvación de Destreza fallida, mitad si la superan. A niveles superiores: +1d6 de un tipo por nivel."],["commune-with-nature","Comunión con la Naturaleza","Commune with Nature",5,"Adivinación","1 minuto","Personal","V, S","Instantáneo","Ritual. Te fundes con la naturaleza y obtienes conocimiento del terreno en 3 millas: terreno, agua, criaturas poderosas, otros planos y edificaciones."],["tree-stride","Paso Arbóreo","Tree Stride",5,"Conjuración","1 acción","Personal","V, S","Concentración, hasta 1 minuto","Puedes entrar en un árbol y salir por otro de la misma especie a 500 pies, gastando 5 pies de movimiento. Una vez por turno."],["hold-monster","Inmovilizar Monstruo","Hold Monster",5,"Encantamiento","1 acción","90 pies","V, S, M","Concentración, hasta 1 minuto","Una criatura que no sea no-muerta debe superar una salvación de Sabiduría o quedar paralizada. Repite la salvación al final de cada uno de sus turnos."],["scrying","Escrutinio","Scrying",5,"Adivinación","10 minutos","Personal","V, S, M","Concentración, hasta 10 minutos","Ves y oyes a una criatura concreta, a cualquier distancia en el mismo plano. Si falla una salvación de Sabiduría, un sensor invisible aparece junto a ella."]],ph=[["guiding-bolt","Proyectil de Guía","Guiding Bolt",1,"Evocación","1 acción","120 pies","V, S","1 asalto","Un destello de luz golpea a una criatura. Ataque de conjuro a distancia: 4d6 de daño radiante, y el siguiente ataque contra ella antes del final de tu próximo turno tiene ventaja. A niveles superiores: +1d6 por nivel."],["arms-of-hadar","Brazos de Hadar","Arms of Hadar",1,"Conjuración","1 acción","Personal (10 pies)","V, S","Instantáneo","Zarcillos oscuros brotan de ti. Cada criatura a 10 pies hace una salvación de Fuerza: 2d6 de daño necrótico y no puede reaccionar hasta su siguiente turno; mitad de daño si la supera. A niveles superiores: +1d6 por nivel."],["dissonant-whispers","Susurros Disonantes","Dissonant Whispers",1,"Encantamiento","1 acción","60 pies","V","Instantáneo","Susurras una melodía terrible que solo oye una criatura. Hace una salvación de Sabiduría: 3d6 de daño psíquico y debe usar su reacción para alejarse de ti; mitad de daño y sin huir si la supera. A niveles superiores: +1d6 por nivel."],["alarm","Alarma","Alarm",1,"Abjuración","1 minuto","30 pies","V, S, M","8 horas","Ritual. Pones una alarma en un área de 20 pies de lado. Te avisa —mental o audiblemente— cuando una criatura de tamaño Diminuto o mayor entra, salvo que la hayas designado."],["calm-emotions","Calmar Emociones","Calm Emotions",2,"Encantamiento","1 acción","60 pies","V, S","Concentración, hasta 1 minuto","Cada humanoide en una esfera de 20 pies de radio hace una salvación de Carisma. En quien falle, suprimes el miedo y el encantamiento, o le vuelves indiferente hacia criaturas que le provocaran hostilidad."],["hunger-of-hadar","Hambre de Hadar","Hunger of Hadar",3,"Conjuración","1 acción","150 pies","V, S, M","Concentración, hasta 1 minuto","Abres una esfera de vacío frío de 20 pies de radio: área fuertemente oscurecida y terreno difícil. Quien empiece su turno dentro recibe 2d6 de frío; quien lo termine dentro hace una salvación de Destreza o recibe 2d6 perforante de tentáculos invisibles."],["sending","Enviar Mensaje","Sending",3,"Evocación","1 acción","Ilimitado","V, S, M","1 asalto","Mandas un mensaje de 25 palabras a una criatura que conozcas, en cualquier parte del mismo plano, y puede responderte igual. Desde otro plano, hay un 5 % de que el mensaje no llegue."],["compulsion","Compulsión","Compulsion",4,"Encantamiento","1 acción","30 pies","V, S","Concentración, hasta 1 minuto","Las criaturas que elijas hacen una salvación de Sabiduría. En cada uno de sus turnos, las que fallen deben usar todo su movimiento en la dirección horizontal que tú marques como acción adicional."],["evards-black-tentacles","Tentáculos Negros de Evard","Evard's Black Tentacles",4,"Conjuración","1 acción","90 pies","V, S, M","Concentración, hasta 1 minuto","Tentáculos llenan un cuadrado de 20 pies: terreno difícil. Quien entre o empiece su turno dentro hace una salvación de Destreza o recibe 3d6 contundente y queda apresado. Los apresados repiten la salvación al final de cada turno."],["summon-aberration","Invocar Aberración","Summon Aberration",4,"Conjuración","1 acción","90 pies","V, S, M","Concentración, hasta 1 hora","Invocas un espíritu aberrante: de garras, de tentáculos o de espadañas. Actúa en tu iniciativa, obedece tus órdenes verbales y su ataque usa tu bonificador de ataque de conjuro. A niveles superiores mejora su tamaño y su daño."],["summon-construct","Invocar Constructo","Summon Construct",4,"Conjuración","1 acción","90 pies","V, S, M","Concentración, hasta 1 hora","Invocas un espíritu constructo de arcilla, metal o piedra. Actúa en tu iniciativa, obedece tus órdenes verbales, es inmune al veneno y al agotamiento, y su ataque usa tu bonificador de ataque de conjuro."],["telekinesis","Telequinesis","Telekinesis",5,"Transmutación","1 acción","60 pies","V, S","Concentración, hasta 10 minutos","Con tu acción cada turno, mueves con la mente a una criatura —salvación de Fuerza— hasta 30 pies en cualquier dirección, o manipulas un objeto de hasta 1000 libras."],["greater-restoration","Restauración Mayor","Greater Restoration",5,"Abjuración","1 acción","Toque","V, S, M","Instantáneo","Quitas un efecto que aflija a la criatura: un nivel de agotamiento, un encantamiento o petrificación, u
